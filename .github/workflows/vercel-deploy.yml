name: Deploy to Vercel

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build
      env:
        NODE_OPTIONS: --max-old-space-size=4096
      
    # Only attempt Vercel deployment if secrets are available
    - name: Check for Vercel secrets
      id: vercel-secrets
      run: |
        if [[ -n "${{ secrets.VERCEL_TOKEN }}" && -n "${{ secrets.VERCEL_ORG_ID }}" && -n "${{ secrets.VERCEL_PROJECT_ID }}" ]]; then
          echo "has_secrets=true" >> $GITHUB_OUTPUT
        else
          echo "has_secrets=false" >> $GITHUB_OUTPUT
          echo "::warning::Skipping Vercel deployment - required secrets not found (VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID)"
        fi

    - name: Deploy to Vercel (Production)
      if: |
        steps.vercel-secrets.outputs.has_secrets == 'true' && 
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-args: '--prod'
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        github-comment: true

    - name: Deploy to Vercel (Preview)
      if: |
        steps.vercel-secrets.outputs.has_secrets == 'true' && 
        github.ref != 'refs/heads/main' && 
        github.ref != 'refs/heads/master'
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-args: '--no-wait'
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        github-comment: true

    # Only run this if we have Vercel secrets and it's a PR
    - name: Comment PR with deployment URL
      if: |
        steps.vercel-secrets.outputs.has_secrets == 'true' && 
        github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          try {
            const { data: deployments } = await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            const latestDeployment = deployments[0];
            if (latestDeployment) {
              const deploymentUrl = `https://${latestDeployment.environment}.vercel.app`;

              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `🚀 **Preview Deployment Ready!**
                \n\n📱 **URL:** ${deploymentUrl}
                \n\nThis preview will be automatically updated when you push new commits to this PR.`
              });
            }
          } catch (error) {
            console.log('Error getting deployment info:', error);
          }
          
    # Add a success comment on PR when build passes but Vercel deployment is skipped
    - name: Comment PR on successful build without deployment
      if: |
        steps.vercel-secrets.outputs.has_secrets == 'false' && 
        github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `✅ **Build Successful!**
            
            The application built successfully, but deployment to Vercel was skipped because the required secrets are not configured.
            
            To enable Vercel deployments, please add the following secrets to this repository:
            - \`VERCEL_TOKEN\`
            - \`VERCEL_ORG_ID\`
            - \`VERCEL_PROJECT_ID\`
            
            These can be added in the repository settings under Secrets > Actions.`
          });
